# 오시는 길 지도의 자료. OpenStreetMap(Overpass)에서 받아 src/content/map.json으로 커밋한다. docs/plan.md 9.5.4.
# 작업 세션 안에서는 바깥 주소가 막혀 있어 여기서 받는다. Actions 탭에서 손으로 돌릴 수도 있다(Run workflow).
# 이 워크플로가 올린 커밋은 미리보기를 스스로 부르지 않으므로, 끝에서 미리보기를 한 번 부른다.
name: map-data
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/make-map.mjs']
permissions:
  contents: write
  actions: write
concurrency:
  group: map-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/make-map.mjs
      - name: commit
        id: commit
        run: |
          if git diff --quiet -- src/content/map.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/map.json
          git commit -m "지도 자료 갱신 (OpenStreetMap)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: preview
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run preview.yml --ref "${GITHUB_REF_NAME}"
